embedding_model: "openai/clip-vit-base-patch32"
text_chunk_size: 512
text_chunk_overlap: 50
vector_db_path: "./chroma_db"
batch_size: 32
top_k_results: 5
similarity_threshold: 0.5
supported_formats:
  documents: ["pdf", "docx", "txt"]
  images: ["png", "jpg", "jpeg", "tiff", "bmp"]
  tables: ["csv", "xlsx", "json"]